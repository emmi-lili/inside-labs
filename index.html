<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Lab — Conoce a tus clientes con IA</title>
<meta name="description" content="Digital Lab crea tu página web y un agente de IA que conversa con cada visitante, lo entiende y lo convierte en cliente." />

<!-- Tailwind CSS (Play CDN) + plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#F0FDF4', 100: '#DCFCE7', 200: '#BBF7D0', 400: '#4ADE80',
            500: '#00D06C', 600: '#10B981', 700: '#047857',
            dark: '#0A1811', surface: '#FAFCFA', card: '#FFFFFF', border: '#E8EFEA'
          }
        },
        fontFamily: {
          sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          tech: ['Space Grotesk', 'sans-serif']
        },
        boxShadow: {
          'glow-sm': '0 0 20px -5px rgba(0, 208, 108, 0.35)',
          'glow-lg': '0 10px 40px -10px rgba(0, 208, 108, 0.4)',
          'glass': '0 8px 30px rgba(10, 24, 17, 0.05)',
          'float': '0 20px 40px -15px rgba(16, 185, 129, 0.12)'
        },
        animation: {
          'float-slow': 'floatY 6s ease-in-out infinite',
          'float-delayed': 'floatY 7s ease-in-out 2s infinite'
        },
        keyframes: {
          floatY: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } }
        }
      }
    }
  };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Poppins:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  /* ===== Tokens (usados por el HERO, que se mantiene intacto) ===== */
  :root {
    --accent: #1DB81D;
    --accent-dark: #169016;
    --accent-soft: #e9f9e9;
    --violet: #8b7bd8;
    --ink: #111111;
    --ink-60: #4a4a4a;
    --ink-40: #777777;
    --line: #ececec;
    --radius: 12px;
    --shadow-sm: 0 2px 10px rgba(17,17,17,.05);
    --shadow-md: 0 12px 40px rgba(17,17,17,.08);
    --shadow-lg: 0 24px 70px rgba(17,17,17,.12);
    --maxw: 1180px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    background: #FAFCFA;
    color: #0E1E15;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { text-decoration: none; color: inherit; }

  /* ===== HERO (rediseñado: sky card + arco 3D de tarjetas) ===== */
  .hero { padding: 8px; background: transparent; }
  .hero, .hero * { font-family: 'Poppins', system-ui, sans-serif; }
  .hero-links a, .hero-navbtn, .hero-cta a, .hero-rating .rtext, .hero-eyebrow, .hero-live {
    font-family: 'DM Mono', ui-monospace, 'SFMono-Regular', monospace;
  }

  .hero-card {
    position: relative; isolation: isolate; width: 100%; min-height: 92vh; border-radius: 28px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 22px clamp(16px, 4vw, 44px) 42px; color: #fff;
    /* Fondo: scrim superior para legibilidad + foto de cielo (image.png) + degradado de fallback */
    background-image:
      linear-gradient(180deg, rgba(9,52,124,.62) 0%, rgba(20,100,192,.24) 26%, rgba(70,158,238,.03) 48%, rgba(70,158,238,.12) 100%),
      url('public/reference/image.png'),
      linear-gradient(180deg, #1A7FE0 0%, #3E97EC 55%, #6FB7F4 100%);
    background-size: cover, cover, cover;
    background-position: center top, center bottom, center;
    background-repeat: no-repeat;
  }

  /* --- Nav interna del hero --- */
  .hero-nav { width: 100%; max-width: 1200px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 6px 4px; z-index: 5; }
  .hero-logo { display: flex; align-items: center; gap: 9px; color: #fff; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .hero-logo .mark { width: 26px; height: 26px; border-radius: 7px; background: #fff; color: #1A7FE0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; }
  .hero-links { display: flex; gap: 26px; }
  .hero-links a { color: #fff; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .88; transition: opacity .15s; }
  .hero-links a:hover { opacity: 1; }
  .hero-navbtn { background: #D9F75C; color: #0b2a12; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 11px 18px; border-radius: 100px; font-weight: 500; transition: transform .18s ease, box-shadow .18s ease; }
  .hero-navbtn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(217,247,92,.4); }

  /* --- Texto central --- */
  .hero-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 44px 0 6px; }
  .hero-title { font-size: clamp(40px, 7vw, 72px); font-weight: 500; letter-spacing: -.03em; line-height: 1.05; color: #fff; }
  .hero-title .l2 { color: rgba(255,255,255,.7); }
  .hero-sub { margin-top: 20px; max-width: 480px; font-size: 16px; line-height: 1.6; color: rgba(255,255,255,.85); }
  .hero-cta { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hero-cta a { display: inline-flex; align-items: center; gap: 12px; border-radius: 100px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 15px 22px; font-weight: 500; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
  .hero-cta-sec { background: rgba(10,40,90,.45); color: #fff; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.18); }
  .hero-cta-sec:hover { background: rgba(10,40,90,.62); transform: translateY(-2px); }
  .hero-cta-pri { background: #D9F75C; color: #0b2a12; }
  .hero-cta-pri:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(217,247,92,.45); }
  .hero-cta-pri .arrow { width: 22px; height: 22px; border-radius: 50%; background: #0b2a12; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }

  /* --- Carrusel 3D de tarjetas --- */
  .hero-carousel { margin-top: 30px; width: 100%; max-width: 1100px; perspective: 1150px; display: flex; justify-content: center; align-items: center; }
  .c-slot { flex: 0 0 auto; margin: 0 -5px; transform-style: preserve-3d; }
  .c-card {
    width: 128px; height: 168px; border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 18px 40px rgba(10,30,60,.30); border: 1px solid rgba(255,255,255,.4);
    animation: cfloat 5.5s ease-in-out infinite; animation-delay: var(--d, 0s);
    display: flex; flex-direction: column;
  }
  @keyframes cfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

  /* contenidos de tarjeta (placeholders) */
  .cc { padding: 12px; width: 100%; height: 100%; display: flex; flex-direction: column; gap: 8px; }
  .cc-label { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: #7b8aa0; }
  .cc-metric { font-size: 30px; font-weight: 700; letter-spacing: -.03em; color: #10213a; line-height: 1; }
  .cc-sub { font-size: 10px; color: #8a97a8; margin-top: auto; }
  .cc-bars { display: flex; align-items: flex-end; gap: 5px; height: 60px; margin-top: auto; }
  .cc-bars span { flex: 1; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, #4aa3f0, #1A7FE0); }
  .cc-line { margin-top: auto; }
  .c-black { background: #0c1220; color: #fff; }
  .c-black .cc-metric { color: #D9F75C; }
  .c-black .cc-label { color: rgba(255,255,255,.55); }
  .c-black .cc-txt { font-size: 12px; line-height: 1.35; font-weight: 500; }
  .c-glass { background: rgba(60,130,220,.28); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.45); align-items: center; justify-content: center; }
  .c-glass .plus { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 300; color: #fff; }
  .c-photo { object-fit: cover; }
  .c-lime { background: #D9F75C; }
  .c-lime .cc-metric { color: #142a05; }
  .c-lime .cc-label { color: #3f5a10; }
  .cc-donut { margin: auto; width: 60px; height: 60px; border-radius: 50%; background: conic-gradient(#1A7FE0 0 68%, #e3ecf7 0 100%); display: flex; align-items: center; justify-content: center; }
  .cc-donut::after { content: '68%'; width: 38px; height: 38px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #10213a; }

  /* --- Rating --- */
  .hero-rating { margin-top: 26px; text-align: center; }
  .hero-rating .rtext { font-size: 12px; letter-spacing: .05em; color: rgba(255,255,255,.9); }
  .hero-rating .stars { margin-top: 6px; color: #D9F75C; font-size: 15px; letter-spacing: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .c-card { animation: none; }
  }

  /* grid pattern for reference sections */
  .bg-grid-pattern {
    background-size: 40px 40px;
    background-image:
      linear-gradient(to right, rgba(0,208,108,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,208,108,.05) 1px, transparent 1px);
  }

  /* Tablet: 5 tarjetas en el arco (oculta las 2 de cada extremo) */
  @media (max-width: 1024px) {
    .hero-carousel .c-slot:nth-child(-n+2),
    .hero-carousel .c-slot:nth-child(n+8) { display: none; }
  }
  /* Mobile: título ~40px, botones apilados, carrusel con scroll-snap plano, links ocultos */
  @media (max-width: 640px) {
    .hero-links { display: none; }
    .hero-cta { flex-direction: column; width: 100%; max-width: 320px; }
    .hero-cta a { width: 100%; justify-content: center; }
    .hero-carousel {
      perspective: none; justify-content: flex-start; max-width: 100%;
      overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px;
      padding: 4px 16px 10px; -webkit-overflow-scrolling: touch;
    }
    .hero-carousel::-webkit-scrollbar { display: none; }
    .hero-carousel .c-slot { margin: 0; transform: none !important; scroll-snap-align: center; }
    .hero-carousel .c-slot:nth-child(-n+2),
    .hero-carousel .c-slot:nth-child(n+8) { display: block; }
  }
</style>
</head>
<body class="antialiased selection:bg-brand-500 selection:text-white">
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
