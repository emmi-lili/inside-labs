<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Lab — Conoce a tus clientes con IA</title>
<meta name="description" content="Digital Lab crea tu página web y un agente de IA que conversa con cada visitante, lo entiende y lo convierte en cliente." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #1DB81D;
    --accent-dark: #169016;
    --accent-soft: #e9f9e9;
    --lime: #c7f24a;
    --violet: #8b7bd8;
    --violet-soft: #f0edfb;
    --ink: #111111;
    --ink-60: #4a4a4a;
    --ink-40: #777777;
    --line: #ececec;
    --bg: #ffffff;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 2px 10px rgba(17,17,17,.05);
    --shadow-md: 0 12px 40px rgba(17,17,17,.08);
    --shadow-lg: 0 24px 70px rgba(17,17,17,.12);
    --maxw: 1180px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Poppins', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -.02em; line-height: 1.12; }
  .accent { color: var(--accent); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: inherit; font-weight: 500; font-size: 15px; cursor: pointer;
    border: none; border-radius: 100px; padding: 14px 28px;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
    box-shadow: 0 8px 22px rgba(29,184,29,.28);
  }
  .btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 14px 30px rgba(29,184,29,.34); }
  .btn-ghost { background: transparent; color: var(--accent); padding-left: 10px; padding-right: 10px; }
  .btn-ghost:hover { color: var(--accent-dark); transform: translateY(-1px); }

  /* ---------- Navbar ---------- */
  .nav-outer { position: sticky; top: 18px; z-index: 100; padding: 0 24px; }
  .nav {
    max-width: var(--maxw); margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.85); backdrop-filter: saturate(180%) blur(14px);
    box-shadow: var(--shadow-sm); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 16px 12px 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 19px; }
  .iso { width: 30px; height: 30px; display: block; }
  .nav-links { display: flex; gap: 30px; list-style: none; }
  .nav-links a { font-size: 15px; color: var(--ink-60); transition: color .15s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta { font-size: 14px; padding: 11px 22px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent-dark); box-shadow: none; }
  .nav-cta:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
  .burger { display: none; background: none; border: none; cursor: pointer; width: 26px; height: 20px; position: relative; }
  .burger span { position: absolute; left: 0; width: 100%; height: 2px; background: var(--ink); border-radius: 2px; }
  .burger span:nth-child(1){ top: 0 } .burger span:nth-child(2){ top: 9px } .burger span:nth-child(3){ top: 18px }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; padding: 70px 0 40px;
    background: linear-gradient(180deg, #fff 0%, #fff 55%, #f6f7f6 100%);
    overflow: hidden;
  }
  .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; min-height: 520px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500;
    color: var(--accent-dark); background: var(--accent-soft);
    padding: 7px 14px; border-radius: 100px; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .hero h1 { font-size: clamp(44px, 6.5vw, 76px); font-weight: 600; letter-spacing: -.03em; }
  .hero .sub { margin: 24px 0 0; max-width: 440px; font-size: 18px; color: var(--ink-60); }
  .hero-actions { margin-top: 34px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  /* hero visual cluster */
  .hero-visual { position: relative; height: 480px; }
  .arrow-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; pointer-events: none; }
  .avatar {
    position: absolute; border-radius: 26px; object-fit: cover; z-index: 2;
    box-shadow: var(--shadow-md); border: 4px solid #fff; background: #eee;
    animation: floaty 7s ease-in-out infinite;
  }
  .a1 { width: 92px; height: 92px; top: 6px; left: 30px; animation-delay: 0s; }
  .a2 { width: 104px; height: 104px; top: 0; right: 40px; animation-delay: .6s; }
  .a3 { width: 82px; height: 82px; top: 165px; right: -6px; animation-delay: 1.2s; }
  .a4 { width: 96px; height: 96px; bottom: 30px; right: 90px; animation-delay: .9s; }
  .a5 { width: 78px; height: 78px; bottom: 6px; left: 44px; animation-delay: 1.5s; }
  @keyframes floaty { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-12px);} }

  /* center card group */
  .card-group { position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%); z-index: 3; }
  .v-tab {
    position: absolute; left: -58px; top: 24px; width: 46px; height: 160px;
    background: #111; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-md);
  }
  .v-tab span { writing-mode: vertical-rl; transform: rotate(180deg); color: #fff; font-size: 13px; font-weight: 500; letter-spacing: .04em; }
  .metric-card {
    width: 230px; background: #fff; border: 1px solid var(--line); border-radius: 20px;
    padding: 18px 20px; box-shadow: var(--shadow-lg); transform: rotate(-3deg);
    animation: floaty 6.5s ease-in-out infinite;
  }
  .mc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .mc-tag { font-size: 11px; font-weight: 600; color: var(--ink-40); display: flex; align-items: center; gap: 6px; }
  .mc-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .mc-chart { margin: 8px 0; display: block; }
  .mc-value { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .mc-value small { font-size: 14px; font-weight: 600; color: var(--accent-dark); }
  .report-card {
    position: absolute; right: -54px; bottom: -34px; width: 118px; background: var(--accent);
    color: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 16px 30px rgba(29,184,29,.4);
    transform: rotate(5deg); animation: floaty 7.5s ease-in-out infinite .4s;
  }
  .report-card .rc-top { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; opacity: .95; }
  .report-card .rc-big { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .pill-insights {
    position: absolute; left: -30px; bottom: 20px; z-index: 4; background: #fff; border: 1px solid var(--line);
    box-shadow: var(--shadow-md); border-radius: 100px; padding: 9px 8px 9px 16px;
    display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500;
    animation: floaty 6s ease-in-out infinite 1s;
  }
  .pill-insights .toggle { width: 34px; height: 20px; border-radius: 100px; background: var(--accent); position: relative; }
  .pill-insights .toggle::after { content:''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; top: 3px; right: 3px; }

  .scroll-ind { position: absolute; right: 30px; bottom: 24px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--ink-40); z-index: 6; }
  .scroll-ind .line { width: 1px; height: 34px; background: var(--ink-40); position: relative; overflow: hidden; }
  .scroll-ind .line::after { content:''; position: absolute; top: -10px; left: 0; width: 100%; height: 10px; background: var(--accent); animation: scrolldrop 1.8s ease-in-out infinite; }
  @keyframes scrolldrop { 0%{ transform: translateY(0);} 100%{ transform: translateY(44px);} }

  /* ---------- Sections ---------- */
  section { position: relative; }
  .section-pad { padding: 96px 0; }
  .center { text-align: center; }
  .kicker { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .section-title { font-size: clamp(28px, 4vw, 40px); margin-top: 12px; }
  .section-lead { max-width: 540px; margin: 16px auto 0; color: var(--ink-60); font-size: 17px; }

  /* logos */
  .logos { padding: 44px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fafafa; }
  .logos p { text-align: center; font-size: 13px; color: var(--ink-40); margin-bottom: 26px; letter-spacing: .04em; }
  .logo-row { display: flex; flex-wrap: wrap; gap: 44px; justify-content: center; align-items: center; opacity: .55; }
  .logo-row span { font-size: 21px; font-weight: 600; color: #9a9a9a; letter-spacing: -.01em; }

  /* benefits */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 56px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 30px 28px;
    box-shadow: var(--shadow-sm); transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .ic { width: 50px; height: 50px; border-radius: 13px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .ic svg { width: 24px; height: 24px; stroke: var(--accent-dark); }
  .card h3 { font-size: 19px; margin-bottom: 8px; }
  .card p { font-size: 15px; color: var(--ink-60); }

  /* steps */
  .steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; margin-top: 56px; }
  .step { text-align: center; padding: 10px; position: relative; }
  .step .num {
    width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px;
    color: var(--accent-dark); background: var(--accent-soft); border: 1px solid #d3f0d3;
  }
  .step h3 { font-size: 18px; margin-bottom: 6px; }
  .step p { font-size: 15px; color: var(--ink-60); max-width: 280px; margin: 0 auto; }

  /* results */
  .results { background: linear-gradient(180deg, #fafafa, #f3f5f3); }
  .metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; margin-top: 52px; }
  .metric { text-align: center; }
  .metric .big { font-size: clamp(42px, 6vw, 60px); font-weight: 700; letter-spacing: -.03em; }
  .metric .big.v { color: var(--violet); }
  .metric .lbl { font-size: 15px; color: var(--ink-60); margin-top: 4px; }

  /* final cta */
  .cta-final { background: var(--accent-soft); border-radius: 24px; padding: 72px 32px; text-align: center; margin: 0 24px; }
  .cta-final h2 { font-size: clamp(30px, 4.5vw, 44px); max-width: 640px; margin: 0 auto; }
  .cta-final p { color: var(--ink-60); max-width: 480px; margin: 16px auto 32px; font-size: 17px; }

  /* footer */
  footer { padding: 60px 0 40px; border-top: 1px solid var(--line); margin-top: 96px; }
  .foot-grid { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .foot-links { display: flex; gap: 48px; flex-wrap: wrap; }
  .foot-col h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-40); margin-bottom: 14px; font-weight: 600; }
  .foot-col a { display: block; font-size: 15px; color: var(--ink-60); margin-bottom: 10px; }
  .foot-col a:hover { color: var(--ink); }
  .socials { display: flex; gap: 12px; margin-top: 16px; }
  .socials a { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; transition: .15s; }
  .socials a:hover { background: var(--accent-soft); border-color: #d3f0d3; }
  .socials svg { width: 18px; height: 18px; fill: var(--ink-60); }
  .foot-bottom { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-40); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .nav-links { display: none; }
    .burger { display: block; }
    .hero-grid { grid-template-columns: 1fr; text-align: center; }
    .hero .sub { margin-left: auto; margin-right: auto; }
    .hero-actions { justify-content: center; }
    .hero-visual { height: 420px; margin-top: 20px; }
    .scroll-ind { display: none; }
    .grid-3, .steps, .metrics { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .hero-visual { transform: scale(.82); height: 360px; }
    .foot-links { gap: 28px; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
