<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Lab — Conoce a tus clientes con IA</title>
<meta name="description" content="Digital Lab crea tu página web y un agente de IA que conversa con cada visitante, lo entiende y lo convierte en cliente." />

<!-- Tailwind CSS (Play CDN) + plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#F0FDF4', 100: '#DCFCE7', 200: '#BBF7D0', 400: '#4ADE80',
            500: '#00D06C', 600: '#10B981', 700: '#047857',
            dark: '#0A1811', surface: '#FAFCFA', card: '#FFFFFF', border: '#E8EFEA'
          }
        },
        fontFamily: {
          sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          tech: ['Space Grotesk', 'sans-serif']
        },
        boxShadow: {
          'glow-sm': '0 0 20px -5px rgba(0, 208, 108, 0.35)',
          'glow-lg': '0 10px 40px -10px rgba(0, 208, 108, 0.4)',
          'glass': '0 8px 30px rgba(10, 24, 17, 0.05)',
          'float': '0 20px 40px -15px rgba(16, 185, 129, 0.12)'
        },
        animation: {
          'float-slow': 'floatY 6s ease-in-out infinite',
          'float-delayed': 'floatY 7s ease-in-out 2s infinite'
        },
        keyframes: {
          floatY: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } }
        }
      }
    }
  };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Poppins:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  /* ===== Tokens (usados por el HERO, que se mantiene intacto) ===== */
  :root {
    --accent: #1DB81D;
    --accent-dark: #169016;
    --accent-soft: #e9f9e9;
    --violet: #8b7bd8;
    --ink: #111111;
    --ink-60: #4a4a4a;
    --ink-40: #777777;
    --line: #ececec;
    --radius: 12px;
    --shadow-sm: 0 2px 10px rgba(17,17,17,.05);
    --shadow-md: 0 12px 40px rgba(17,17,17,.08);
    --shadow-lg: 0 24px 70px rgba(17,17,17,.12);
    --maxw: 1180px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    background: #FAFCFA;
    color: #0E1E15;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { text-decoration: none; color: inherit; }

  /* ===== HERO (rediseñado: sky card + arco 3D de tarjetas) ===== */
  .hero { padding: 8px; background: transparent; }
  .hero, .hero * { font-family: 'Poppins', system-ui, sans-serif; }

  .hero-card {
    position: relative; width: 100%; min-height: 90vh; border-radius: 24px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px clamp(16px, 4vw, 40px) 40px; color: #fff;
    /* Fondo: overlay + foto de cielo (image.png) + degradado de fallback */
    background-image:
      linear-gradient(180deg, rgba(18,96,196,.45) 0%, rgba(90,174,242,.10) 55%, rgba(90,174,242,0) 78%),
      url('public/reference/image.png'),
      linear-gradient(180deg, #1A7FE0 0%, #5AAEF2 100%);
    background-size: cover, cover, cover;
    background-position: center, center bottom, center;
    background-repeat: no-repeat;
  }

  /* --- Nav interna del hero --- */
  .hero-nav { width: 100%; max-width: 1200px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 6px 4px; z-index: 5; }
  .hero-logo { display: flex; align-items: center; gap: 9px; color: #fff; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .hero-logo .mark { width: 26px; height: 26px; border-radius: 7px; background: #fff; color: #1A7FE0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; }
  .hero-links { display: flex; gap: 26px; }
  .hero-links a { color: #fff; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .88; transition: opacity .15s; }
  .hero-links a:hover { opacity: 1; }
  .hero-navbtn { background: #D9F75C; color: #0b2a12; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 11px 18px; border-radius: 100px; font-weight: 500; transition: transform .18s ease, box-shadow .18s ease; }
  .hero-navbtn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(217,247,92,.4); }

  /* --- Texto central --- */
  .hero-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 44px 0 6px; }
  .hero-title { font-size: clamp(40px, 7vw, 72px); font-weight: 500; letter-spacing: -.03em; line-height: 1.05; color: #fff; }
  .hero-title .l2 { color: rgba(255,255,255,.7); }
  .hero-sub { margin-top: 20px; max-width: 480px; font-size: 16px; line-height: 1.6; color: rgba(255,255,255,.85); }
  .hero-cta { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hero-cta a { display: inline-flex; align-items: center; gap: 12px; border-radius: 100px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 15px 22px; font-weight: 500; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
  .hero-cta-sec { background: rgba(10,40,90,.45); color: #fff; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.18); }
  .hero-cta-sec:hover { background: rgba(10,40,90,.62); transform: translateY(-2px); }
  .hero-cta-pri { background: #D9F75C; color: #0b2a12; }
  .hero-cta-pri:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(217,247,92,.45); }
  .hero-cta-pri .arrow { width: 22px; height: 22px; border-radius: 50%; background: #0b2a12; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }

  /* grid pattern for reference sections */
  .bg-grid-pattern {
    background-size: 40px 40px;
    background-image:
      linear-gradient(to right, rgba(0,208,108,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,208,108,.05) 1px, transparent 1px);
  }

  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr; text-align: center; }
    .hero .sub { margin-left: auto; margin-right: auto; }
    .hero-actions { justify-content: center; }
    .hero-visual { height: 420px; margin-top: 20px; }
    .scroll-ind { display: none; }
  }
  @media (max-width: 520px) {
    .hero-visual { transform: scale(.82); height: 360px; }
  }
</style>
</head>
<body class="antialiased selection:bg-brand-500 selection:text-white">
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
